# Production-aligned config. LaunchAgent may still set LOKAY_* env overrides.
# Agent stubs are FORBIDDEN — see docs/NO_STUBS.md

mode: live

repos:
  - name: mikolaj92/Temida
    clone_path: ~/Developer/OSS/Temida
    enabled: false

repos_file: repos.mikolaj92.yaml

github:
  assignee: mikolaj92
  allow_unassigned: false
  ready_label: ai:ready
  blocked_label: ai:blocked
  needs_feedback_label: ai:needs-feedback
  branch_prefix: ai/fix
  pr_labels:
    - ai:generated
    - ai:pr-opened

executor:
  enabled: true
  agent: pi
  command: pi
  model: omniroute/pi
  args:
    - -p
    - "{prompt}"
    - --model
    - "{model}"
    - --approve
    - --session-id
    - "{session}"
  max_turns: 20
  timeout_seconds: 1800
  always_approve: true

merge:
  enabled: true
  # Local trust only — do NOT gate merges on GitHub Actions / remote CI providers.
  require_checks: false
  # Blind pr_review before auto-merge. Builder is not reviewer.
  require_llm_review: true

# OpenCodeReview v1.12.0 is a separate, read-only review process. The
# credential is injected only into this adapter's allowlisted environment.
pr_review:
  engine: open-code-review
  plugin_command: /Users/mini-m4-0/Developer/OSS/lokay/plugins/pr_review_open_code_review/.venv/bin/lokay-review-opencode-plugin
  plugin_args: [--max-input-bytes, "4194304"]
  plugin_timeout_seconds: 7200
  provider: omniroute
  provider_endpoint_url: https://omniroute.patryk.it/v1
  model: pi
  config_sha256: 831729ee8d0009870f14a25db06882493e6011b0b95967697ea32a6955f3a057
  provider_env: [OCR_LLM_API_KEY]
  binary: /Users/mini-m4-0/.local/bin/ocr
  binary_version: v1.12.0
  binary_sha256: 92601579180aacc61d2d2861773271ddd03d6d5d3a2ac2bea553d883def81cf2
  effort: medium
  timeout_minutes: 30
  max_tokens_budget: 100000
  rule_file: /Users/mini-m4-0/.config/lokay/pr-review/rule.json
  tools_file: /Users/mini-m4-0/.config/lokay/pr-review/tools.json
  ocr_config: /Users/mini-m4-0/.config/lokay/pr-review/opencodereview.json
  manifest: /Users/mini-m4-0/.config/lokay/pr-review/config-manifest.json
  sandbox_profile: /Users/mini-m4-0/.config/lokay/pr-review/review.sb
  sandbox_command: [/usr/bin/sandbox-exec, -f, /Users/mini-m4-0/.config/lokay/pr-review/review.sb, --]
  artifacts_dir: ~/.lokay/pr-review-artifacts

worktrees:
  root: ~/.lokay/worktrees

state:
  path: ~/.lokay/state.jsonl

limits:
  # Sequential start budget, never concurrent worktrees or agents.
  max_issue_to_pr_per_pass: 1
  max_issues_per_tick: 1
  max_triage_per_tick: 5
  max_repairs_per_tick: 1
  max_failures_before_block: 2
  min_free_gb: 2
