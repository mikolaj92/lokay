[project]
name = "lokay"
version = "0.3.0"
description = "Continuous multi-repo issue-to-PR mill built from Unix atoms and Fala."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "fala",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv.sources]
fala = { path = "../Fala", editable = true }

[project.scripts]
lokay = "lokay.cli:main"
# Atomic processes (one job each)
lokay-list-issues = "lokay.proc.list_issues:main"
lokay-list-inbox = "lokay.proc.list_inbox:main"
lokay-get-issue = "lokay.proc.get_issue:main"
lokay-select-issue = "lokay.proc.select_issue:main"
lokay-triage-issue = "lokay.proc.triage_issue:main"
lokay-label-issue = "lokay.proc.label_issue:main"
lokay-close-issue = "lokay.proc.close_issue:main"
lokay-assign-issue = "lokay.proc.assign_issue:main"
lokay-make-branch = "lokay.proc.make_branch:main"
lokay-worktree-add = "lokay.proc.worktree_add:main"
lokay-run-agent = "lokay.proc.run_agent:main"
lokay-commit-all = "lokay.proc.commit_all:main"
lokay-push = "lokay.proc.push_branch:main"
lokay-pr-create = "lokay.proc.pr_create:main"
lokay-pr-label = "lokay.proc.pr_label:main"
lokay-list-prs = "lokay.proc.list_prs:main"
lokay-pr-checks = "lokay.proc.pr_checks:main"
lokay-pr-review = "lokay.proc.pr_review:main"
lokay-pr-merge = "lokay.proc.pr_merge:main"
lokay-pr-close = "lokay.proc.pr_close:main"
# Graph (Fala) + composers
lokay-run-path = "lokay.proc.run_path:main"
lokay-factory-pass = "lokay.compose.factory:main"
lokay-factory-tick = "lokay.proc.factory_tick:main"
lokay-preflight = "lokay.proc.preflight:main"
lokay-daemon = "lokay.proc.daemon:main"
lokay-self-repair-prepare = "lokay.proc.self_repair_prepare:main"
lokay-self-repair-validate = "lokay.proc.self_repair_validate:main"
lokay-self-repair-push-main = "lokay.proc.self_repair_push_main:main"
lokay-self-repair-activate = "lokay.proc.self_repair_activate:main"
lokay-self-repair-preflight = "lokay.proc.self_repair_preflight:main"
lokay-self-repair-close = "lokay.proc.self_repair_close:main"
lokay-repos = "lokay.proc.repos_list:main"
lokay-repos-clone-missing = "lokay.proc.repos_clone_missing:main"
lokay-issue-to-pr = "lokay.compose.issue_to_pr:main"
lokay-pr-repair = "lokay.compose.pr_repair:main"
lokay-pr-triage = "lokay.compose.pr_triage:main"
lokay-tick = "lokay.compose.tick:main"
lokay-mill = "lokay.compose.mill:main"
lokay-status = "lokay.compose.status:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokay"]

[tool.hatch.build.targets.wheel.force-include]
"src/lokay" = "lokay"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
