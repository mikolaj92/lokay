[project]
name = "lokay"
version = "0.1.0"
description = "Lokay beside the old one. Five nodes, then one nuke."
requires-python = ">=3.12,<3.14"
dependencies = [
  "harness2",
  "pyyaml>=6.0",
]

[project.scripts]
lokay = "lokay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokay"]

[tool.uv.sources]
harness2 = { git = "https://github.com/mikolaj92/harness2", rev = "7a1139702bfdb05f7e2b6ecd5c83305065cd48eb" }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
