lokay-test-local = "lokay.proc.test_local:main"
lokay-rebase-onto-base = "lokay.proc.rebase_onto_base:main"
lokay-push = "lokay.proc.push_branch:main"
lokay-pr-create = "lokay.proc.pr_create:main"
