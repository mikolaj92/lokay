[project]
name = "lokay"
version = "0.1.0"
description = "Lokay beside the old one. Five nodes, then one nuke."
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
lokay = "lokay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokay"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
