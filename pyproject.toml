[project]
name = "lokay"
version = "0.3.0"
description = "Continuous multi-repo issue-to-PR mill built from Unix atoms and Fala."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "fala",
  "app-factory[platform]",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv.sources]
fala = { path = "../Fala", editable = true }
app-factory = { git = "https://github.com/mikolaj92/app-factory.git", tag = "v0.5.19" }

[project.scripts]
lokay = "lokay.cli:main"
# Atomic processes (one job each)
lokay-list-issues = "lokay.proc.list_issues:main"
lokay-list-inbox = "lokay.proc.list_inbox:main"
lokay-get-issue = "lokay.proc.get_issue:main"
lokay-select-issue = "lokay.proc.select_issue:main"
lokay-triage-issue = "lokay.proc.triage_issue:main"
lokay-intake-check = "lokay.proc.intake_check:main"
lokay-intake-issue = "lokay.proc.intake_issue:main"
lokay-issue-split = "lokay.proc.issue_split:main"
lokay-label-issue = "lokay.proc.label_issue:main"
lokay-stage-label = "lokay.proc.stage_label:main"
lokay-reap-stale-implementing = "lokay.proc.reap_stale_implementing:main"
lokay-ready-hygiene = "lokay.proc.ready_hygiene:main"
lokay-compact-state = "lokay.proc.compact_state:main"
lokay-rotate-fala-journals = "lokay.proc.rotate_fala_journals:main"
lokay-close-issue = "lokay.proc.close_issue:main"
lokay-assign-issue = "lokay.proc.assign_issue:main"
lokay-make-branch = "lokay.proc.make_branch:main"
lokay-worktree-add = "lokay.proc.worktree_add:main"
lokay-plan-issue = "lokay.proc.plan_issue:main"
lokay-localize = "lokay.proc.localize:main"
lokay-relocalize-off-goal = "lokay.proc.relocalize_off_goal:main"
lokay-run-agent = "lokay.proc.run_agent:main"
