lokay-yield-report = "lokay.proc.yield_report:main"
lokay-wake = "lokay.proc.wake:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lokay"]

[tool.hatch.build.targets.wheel.force-include]
"src/lokay" = "lokay"

[tool.lokay]
# Repository-declared local verifier for lokay-test-local. Missing this table
# is an honest skip — the mill must not invent `uv run --extra dev pytest`.
test = ["uv", "run", "--extra", "dev", "pytest", "-q"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
