lokay-preflight = "lokay.proc.preflight:main"
lokay-daemon = "lokay.proc.daemon:main"
lokay-recovery-begin = "lokay.proc.recovery_begin:main"
lokay-recovery-mill = "lokay.proc.recovery_mill:main"
lokay-recovery-observe = "lokay.proc.recovery_observe:main"
lokay-recovery-record = "lokay.proc.recovery_record:main"
lokay-recovery-incident = "lokay.proc.recovery_incident:main"
