# Declarative process graph for Lokay.
# Nodes = atoms via lokay.fala_organ. Edges = conduction. Agent is one node only.

version = "2"
id = "lokay"
title = "Lokay"
description = "Guarded issue-to-PR graph. Order is the product; agent is one node."

[[capabilities]]
id = "lokay_atom"
title = "Run one Lokay atom via Fala organ"

[[correlation_paths]]
id = "issue_to_pr"
title = "Issue to PR"
description = "Deterministic pipeline with a single non-deterministic agent node."

[[correlation_paths.effectors]]
id = "get_issue"
capability = "lokay_atom"
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 120, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "get_issue" }
retry_policy = "none"

[[correlation_paths.effectors]]
id = "assign_issue"
capability = "lokay_atom"
conduction = ["get_issue"]
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 120, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "assign_issue" }
retry_policy = "none"

[[correlation_paths.effectors]]
id = "make_branch"
capability = "lokay_atom"
conduction = ["get_issue"]
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 60, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "make_branch" }
retry_policy = "none"

[[correlation_paths.effectors]]
id = "worktree_add"
capability = "lokay_atom"
conduction = ["get_issue", "make_branch"]
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 300, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "worktree_add" }
retry_policy = "none"

[[correlation_paths.effectors]]
id = "run_agent"
capability = "lokay_atom"
conduction = ["get_issue", "make_branch", "worktree_add"]
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 3600, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "run_agent" }
retry_policy = "none"

[[correlation_paths.effectors]]
id = "commit_all"
capability = "lokay_atom"
conduction = ["get_issue", "worktree_add", "run_agent"]
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 120, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "commit_all" }
retry_policy = "none"

[[correlation_paths.effectors]]
id = "push"
capability = "lokay_atom"
conduction = ["make_branch", "worktree_add", "commit_all"]
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 300, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "push" }
retry_policy = "none"

[[correlation_paths.effectors]]
id = "pr_create"
capability = "lokay_atom"
conduction = ["get_issue", "make_branch", "run_agent", "push"]
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 180, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "pr_create" }
retry_policy = "none"

[[correlation_paths.effectors]]
id = "list_prs"
capability = "lokay_atom"
conduction = ["get_issue", "pr_create"]
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 120, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "list_prs" }
retry_policy = "none"

[[correlation_paths.effectors]]
id = "pr_label"
capability = "lokay_atom"
conduction = ["get_issue", "make_branch", "list_prs"]
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 120, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "pr_label" }
retry_policy = "none"

# --- Inbox triage: undecided issue → labels (ai:ready is an outcome) ---

[[correlation_paths]]
id = "issue_triage"
title = "Issue triage"
description = "Load one open issue and apply deterministic inbox triage labels."

[[correlation_paths.effectors]]
id = "get_issue"
capability = "lokay_atom"
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 120, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "get_issue" }
retry_policy = "none"

[[correlation_paths.effectors]]
id = "triage_issue"
capability = "lokay_atom"
conduction = ["get_issue"]
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], timeout_seconds = 120, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG"] }
config = { atom = "triage_issue" }
retry_policy = "none"

[runtime.backend]
kind = "sqlite"
path = ".fala/lokay-state.sqlite"

[runtime.reaction_store]
kind = "filesystem"
root = ".fala/reactions"
