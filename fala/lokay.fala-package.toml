# Declarative process graph for Lokay.
# Nodes = atoms via lokay.fala_organ. Edges = conduction. Agent is one node only.

version = "2"
id = "lokay"
title = "Lokay"
description = "Guarded issue-to-PR graph. Order is the product; agent is one node."

[[capabilities]]
id = "lokay_atom"
title = "Run one Lokay atom via Fala organ"

# Parent factory Fala. It owns the top-level pass and invokes child Fala paths
# through the factory_tick subprocess boundary. Parent and children use separate
# journals (factory/ versus ~/.lokay/fala/state.sqlite).
[[correlation_paths]]
id = "daemon_cycle"
title = "Lokay daemon cycle"
description = "Run product work, record 4-of-5 stall evidence, and conduct confirmed recovery."

[[correlation_paths.effectors]]
id = "recovery_begin"
capability = "lokay_atom"
adapter = { kind = "subprocess", command = ["uv", "run", "--project", "PLACEHOLDER_PROJECT", "python", "-m", "lokay.fala_organ"], cwd = "PLACEHOLDER_PROJECT", timeout_seconds = 60, inherit_env = ["PATH", "HOME", "USER", "TMPDIR", "LANG", "FALA_HOME", "LOKAY_ROOT", "PYTHONPATH", "LOKAY_PROCESS_HEAD", "LOKAY_HOST_FF_FETCHED", "LOKAY_HEALTH_LEASE", "LOKAY_HEALTH_LEASE_PATH", "LOKAY_DISABLE_HEALTH_LEASE_ISSUE"] }
config = { atom = "recovery_begin" }
retry_policy = "none"

