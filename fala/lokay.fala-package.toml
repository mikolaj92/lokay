[[correlation_paths]]
id = "factory_pass"
title = "Lokay factory pass"
description = "Parent Fala conducts one multi-repo pass: host_ff -> survey_prs/inbox/ready -> plan -> triage -> conflicts -> closeout -> occupancy -> reap leftover worktrees -> select -> queue_conflict -> implement -> health -> receipt. Serial K=1; mutex per repo. After closeout, refresh occupancy so a just-merged or still-coding repo cannot start a sibling i2pr from stale origin/main. Then drop leftover worktrees that cannot resume (merged / closed CONFLICTING / unpublished-behind-main). Trust intentional owner/assignee issues; contradiction gate is queue hygiene, not a parallel scheduler."

