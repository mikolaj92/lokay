# Twelve steps. when reads only next or result.
version = "2"
id = "lokay"
title = "Lokay2"
description = "Plan, Build, Check, Fix, Merge."

[[capabilities]]
id = "lokay_step"
title = "Run one lokay step"

[[correlation_paths]]
id = "issue"
title = "One issue"

[[correlation_paths.effectors]]
id = "plan_write"
capability = "lokay_step"
adapter = { kind = "subprocess", command = ["lokay", "plan-write"], timeout_seconds = 3600 }
output_schema = { type = "object", required = ["result"] }

[[correlation_paths.effectors]]
id = "plan_check"
capability = "lokay_step"
conduction = ["plan_write"]
when = { upstream = "plan_write", path = "result", equals = "done" }
adapter = { kind = "subprocess", command = ["lokay", "plan-check"], timeout_seconds = 120 }
output_schema = { type = "object", required = ["next"] }

[[correlation_paths.effectors]]
id = "plan_write_revise"
capability = "lokay_step"
conduction = ["plan_check"]
when = { upstream = "plan_check", path = "next", equals = "revise" }
adapter = { kind = "subprocess", command = ["lokay", "plan-write"], timeout_seconds = 3600 }
output_schema = { type = "object", required = ["result"] }

[[correlation_paths.effectors]]
id = "build_code"
capability = "lokay_step"
conduction = ["plan_check"]
when = { upstream = "plan_check", path = "next", equals = "ok" }
adapter = { kind = "subprocess", command = ["lokay", "build-code"], timeout_seconds = 3600 }
output_schema = { type = "object", required = ["result"] }

[[correlation_paths.effectors]]
id = "build_publish"
capability = "lokay_step"
conduction = ["build_code"]
when = { upstream = "build_code", path = "result", equals = "done" }
adapter = { kind = "subprocess", command = ["lokay", "build-publish"], timeout_seconds = 180 }
output_schema = { type = "object", required = ["result"] }

[[correlation_paths.effectors]]
id = "check_ci"
capability = "lokay_step"
conduction = ["build_publish"]
when = { upstream = "build_publish", path = "result", equals = "pr_open" }
adapter = { kind = "subprocess", command = ["lokay", "check-ci"], timeout_seconds = 1800 }
output_schema = { type = "object", required = ["result"] }

[[correlation_paths.effectors]]
id = "check_scope"
capability = "lokay_step"
conduction = ["build_publish"]
when = { upstream = "build_publish", path = "result", equals = "pr_open" }
adapter = { kind = "subprocess", command = ["lokay", "check-scope"], timeout_seconds = 180 }
output_schema = { type = "object", required = ["next"] }

[[correlation_paths.effectors]]
id = "check_tests"
capability = "lokay_step"
conduction = ["build_publish"]
when = { upstream = "build_publish", path = "result", equals = "pr_open" }
adapter = { kind = "subprocess", command = ["lokay", "check-tests"], timeout_seconds = 180 }
output_schema = { type = "object", required = ["next"] }

[[correlation_paths.effectors]]
id = "check_correctness"
capability = "lokay_step"
conduction = ["build_publish"]
when = { upstream = "build_publish", path = "result", equals = "pr_open" }
adapter = { kind = "subprocess", command = ["lokay", "check-correctness"], timeout_seconds = 180 }
output_schema = { type = "object", required = ["next"] }

[[correlation_paths.effectors]]
id = "check_aggregate"
capability = "lokay_step"
conduction = ["check_ci", "check_scope", "check_tests", "check_correctness"]
adapter = { kind = "subprocess", command = ["lokay", "check-aggregate"], timeout_seconds = 60 }
output_schema = { type = "object", required = ["result"] }

[[correlation_paths.effectors]]
id = "fix_code"
capability = "lokay_step"
conduction = ["check_aggregate"]
when = { upstream = "check_aggregate", path = "result", equals = "fix" }
adapter = { kind = "subprocess", command = ["lokay", "fix-code"], timeout_seconds = 3600 }
output_schema = { type = "object", required = ["result"] }

[[correlation_paths.effectors]]
id = "fix_publish"
capability = "lokay_step"
conduction = ["fix_code"]
when = { upstream = "fix_code", path = "result", equals = "done" }
adapter = { kind = "subprocess", command = ["lokay", "fix-publish"], timeout_seconds = 180 }
output_schema = { type = "object", required = ["result"] }

[[correlation_paths.effectors]]
id = "merge"
capability = "lokay_step"
conduction = ["check_aggregate"]
when = { upstream = "check_aggregate", path = "result", equals = "merge" }
adapter = { kind = "subprocess", command = ["lokay", "merge"], timeout_seconds = 180 }
output_schema = { type = "object", required = ["result"] }
