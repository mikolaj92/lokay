version = "2"
id = "lokay-blueprint"
title = "Lokay blueprint"
description = "Tick and blueprint paths. Node bodies are stubs."

[[capabilities]]
id = "lokay_node"
title = "Run one blueprint node"
secret_handles = ["PI_PROVIDER", "PI_MODEL", "LOKAY_ROOT", "PATH", "HOME"]

[[effectors]]
id = "tick_lease"
retry_policy = "none"
adapter = { kind = "subprocess", command = ["python", "-m", "lokay.nodes", "tick_lease"] }

