# Event wake (serial step 2): PR checks complete → lokay-wake (pr close-out).
#
# Design B — same self-hosted runner as lokay-wake-issue (`lokay-mill`).
# Prefer workflow_run on the hermetic `checks` workflow; also accept
# check_suite / check_run completed and manual workflow_dispatch.
#
# When the event carries PR number + head branch → path pr_triage.
# Otherwise → bounded factory_pass (max-passes 1) for survey + close-out.
# Serial by design unchanged; mill lock still serializes overlap.
#
# Residual risk: live Actions → mill host credentials (see lokay-wake-issue).

name: lokay-wake-checks

on:
  workflow_run:
    workflows: ["checks"]
    types: [completed]
  check_suite:
    types: [completed]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (optional; omit for factory_pass survey)
        required: false
        type: string
      branch:
        description: PR head branch (required with pr for pr_triage)
        required: false
        type: string
      live:
        description: Pass --live (mutations; requires healthy mill host)
        required: false
        default: false
        type: boolean

concurrency:
  group: lokay-wake-${{ github.repository }}
  cancel-in-progress: false

jobs:
  wake:
    # workflow_run(checks) is the primary signal. check_suite / check_run only
    # for AI PR heads (ai/fix/*) so wake jobs do not storm themselves.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.conclusion != null &&
       startsWith(github.event.check_suite.head_branch || '', 'ai/fix/')) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.status == 'completed' &&
       startsWith(github.event.check_run.check_suite.head_branch || github.event.check_run.pull_requests[0].head.ref || '', 'ai/fix/') &&
       !contains(github.event.check_run.name || '', 'lokay-wake'))
    runs-on: [self-hosted, lokay-mill]
    env:
      LOKAY_ROOT: ${{ vars.LOKAY_ROOT }}
      LOKAY_CONFIG: ${{ vars.LOKAY_CONFIG }}
      TMPDIR: /tmp
    steps:
      - name: Resolve mill root + wake PR close-out
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          CS_BRANCH: ${{ github.event.check_suite.head_branch || '' }}
          CR_BRANCH: ${{ github.event.check_run.check_suite.head_branch || github.event.check_run.pull_requests[0].head.ref || '' }}
          CR_PR: ${{ github.event.check_run.pull_requests[0].number || '' }}
          DISPATCH_PR: ${{ inputs.pr || '' }}
          DISPATCH_BRANCH: ${{ inputs.branch || '' }}
          DISPATCH_LIVE: ${{ inputs.live || false }}
          WAKE_LIVE_VAR: ${{ vars.LOKAY_WAKE_LIVE || 'false' }}
        run: |
          set -euo pipefail
          ROOT="${LOKAY_ROOT:-${HOME}/Developer/OSS/lokay}"
          CFG="${LOKAY_CONFIG:-${ROOT}/config.yaml}"
          if [[ ! -d "${ROOT}" || ! -f "${CFG}" ]]; then
            echo "mill root/config missing: ROOT=${ROOT} CFG=${CFG}" >&2
            exit 66
          fi
          cd "${ROOT}"
          export PATH="${HOME}/.local/bin:${HOME}/.local/share/mise/shims:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:${PATH:-}"

          REASON="checks"
          case "${EVENT_NAME}" in
            workflow_run) REASON="workflow_run" ;;
            check_suite) REASON="check_suite" ;;
            check_run) REASON="check_run" ;;
            workflow_dispatch) REASON="checks" ;;
          esac

          PR=""
          BRANCH=""
          if [[ -n "${DISPATCH_PR}" ]]; then
            PR="${DISPATCH_PR}"
            BRANCH="${DISPATCH_BRANCH}"
          elif [[ -n "${WR_PR}" ]]; then
            PR="${WR_PR}"
            BRANCH="${WR_BRANCH}"
          elif [[ -n "${CR_PR}" ]]; then
            PR="${CR_PR}"
            BRANCH="${CR_BRANCH}"
          else
            BRANCH="${CS_BRANCH:-${WR_BRANCH:-${CR_BRANCH:-}}}"
          fi

          set -- uv run lokay-wake \
            --config "${CFG}" \
            --reason "${REASON}" \
            --repo "${GITHUB_REPOSITORY}"
          if [[ -n "${PR}" ]]; then
            set -- "$@" --pr "${PR}"
          fi
          if [[ -n "${BRANCH}" ]]; then
            set -- "$@" --branch "${BRANCH}"
          fi
          if [[ "${DISPATCH_LIVE}" == "true" || "${WAKE_LIVE_VAR}" == "true" ]]; then
            set -- "$@" --live
          fi
          "$@"
