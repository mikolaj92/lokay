# Event wake (serial step 2): issue opened / labeled ready → lokay-wake.
#
# Design B — self-hosted mill host:
#   1. Register a GitHub Actions self-hosted runner on the LaunchAgent mill Mac.
#   2. Label the runner `lokay-mill` (and optionally `self-hosted`).
#   3. Set repository variable LOKAY_ROOT to the mill checkout
#      (default ~/Developer/OSS/lokay). Optional LOKAY_CONFIG.
#   4. Set repository variable LOKAY_WAKE_LIVE=true only when live mutations
#      are intended (default is dry-run / planned path without --live).
#
# Residual risk: live mode needs the mill host's gh auth + clones; do not put
# long-lived PATs in Actions secrets unless you accept that exposure.
#
# Copy or reuse this workflow in managed catalog repos so issue events there
# can wake the same runner. Serial by design (K=1) is unchanged — wake only
# nudges one bounded path; it does not start a parallel coding fleet.

name: lokay-wake-issue

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      reason:
        description: Wake reason (issue_opened | issue_labeled | issue)
        required: false
        default: issue_opened
        type: string
      live:
        description: Pass --live (mutations; requires healthy mill host)
        required: false
        default: false
        type: boolean

concurrency:
  group: lokay-wake-${{ github.repository }}
  cancel-in-progress: false

jobs:
  wake:
    # Mill machine only — not ubuntu-latest (needs local gh + clones + Pi).
    runs-on: [self-hosted, lokay-mill]
    env:
      LOKAY_ROOT: ${{ vars.LOKAY_ROOT }}
      LOKAY_CONFIG: ${{ vars.LOKAY_CONFIG }}
      TMPDIR: /tmp
    steps:
      - name: Resolve mill root + wake
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_ISSUE: ${{ github.event.issue.number || inputs.issue }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          ISSUE_LABELS: ${{ github.event_name == 'issues' && join(github.event.issue.labels.*.name, ',') || '' }}
          DISPATCH_REASON: ${{ inputs.reason || '' }}
          DISPATCH_LIVE: ${{ inputs.live || false }}
          WAKE_LIVE_VAR: ${{ vars.LOKAY_WAKE_LIVE || 'false' }}
        run: |
          set -euo pipefail
          ROOT="${LOKAY_ROOT:-${HOME}/Developer/OSS/lokay}"
          CFG="${LOKAY_CONFIG:-${ROOT}/config.yaml}"
          if [[ ! -d "${ROOT}" || ! -f "${CFG}" ]]; then
            echo "mill root/config missing: ROOT=${ROOT} CFG=${CFG}" >&2
            exit 66
          fi
          cd "${ROOT}"
          export PATH="${HOME}/.local/bin:${HOME}/.local/share/mise/shims:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:${PATH:-}"

          if [[ -n "${DISPATCH_REASON}" ]]; then
            REASON="${DISPATCH_REASON}"
          elif [[ "${EVENT_ACTION}" == "labeled" ]]; then
            REASON="issue_labeled"
          elif [[ "${EVENT_ACTION}" == "opened" ]]; then
            REASON="issue_opened"
          else
            REASON="issue"
          fi

          set -- uv run lokay-wake \
            --config "${CFG}" \
            --reason "${REASON}" \
            --repo "${GITHUB_REPOSITORY}" \
            --issue "${EVENT_ISSUE}"
          if [[ -n "${EVENT_LABEL}" ]]; then
            set -- "$@" --label "${EVENT_LABEL}"
          fi
          if [[ -n "${ISSUE_LABELS}" ]]; then
            set -- "$@" --labels "${ISSUE_LABELS}"
          fi
          if [[ "${DISPATCH_LIVE}" == "true" || "${WAKE_LIVE_VAR}" == "true" ]]; then
            set -- "$@" --live
          fi
          # Dry-run by default (no --live): planned Fala/mill path on mill host.
          "$@"
