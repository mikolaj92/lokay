# Lokay lite — multi-repo mill scope for mikolaj92 source libraries.

mode: dry-run  # dry-run | live

# Catalog of product/libs (30 source repos, non-forks). Config `repos:` can override.
repos_file: repos.mikolaj92.yaml

github:
  assignee: mikolaj92
  allow_unassigned: false
  ready_label: ai:ready
  blocked_label: ai:blocked
  needs_feedback_label: ai:needs-feedback
  branch_prefix: ai/fix
  pr_labels:
    - ai:generated
    - ai:pr-opened

# Optional overrides / extras (merged by name on top of repos_file):
# repos:
#   - name: mikolaj92/some-extra
#     clone_path: /path/to/clone
#     priority: 50
#     enabled: true

executor:
  enabled: false
  agent: fake          # fake | grok
  command: grok
  model: null
  max_turns: 40
  timeout_seconds: 1800
  always_approve: true

merge:
  enabled: false
  require_checks: true
  require_test_evidence: true

worktrees:
  root: ~/.lokay/worktrees

state:
  path: ~/.lokay/state.jsonl

limits:
  max_issues_per_tick: 1
  max_triage_per_tick: 5
  max_repairs_per_tick: 1
  max_failures_before_block: 2
  min_free_gb: 2
