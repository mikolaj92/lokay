# Lokay — multi-repo mill for mikolaj92 source libraries.
# Stubs/fake agents are FORBIDDEN — docs/NO_STUBS.md

mode: live  # dry-run | live  (dry-run = no mutations; still real agent if invoked)

# Catalog = which repos we manage (not a denylist).
repos_file: repos.mikolaj92.yaml

github:
  assignee: mikolaj92
  allow_unassigned: false
  ready_label: ai:ready
  blocked_label: ai:blocked
  needs_feedback_label: ai:needs-feedback
  branch_prefix: ai/fix
  pr_labels:
    - ai:generated
    - ai:pr-opened

# Optional overrides / extras (merged by name on top of repos_file):
# repos:
#   - name: mikolaj92/some-extra
#     clone_path: /path/to/clone
#     priority: 50
#     enabled: true

executor:
  enabled: true
  agent: omp                 # label for logs only
  command: omp               # binary on PATH
  model: omniroute/omp/default
  # argv after binary — placeholders: {cwd} {prompt} {model} {max_turns} {timeout}
  # To use grok instead, only change command/args, e.g.:
  #   command: grok
  #   args: [--cwd, "{cwd}", --always-approve, --max-turns, "{max_turns}",
  #          --output-format, plain, -m, "{model}", --permission-mode, bypassPermissions, -p, "{prompt}"]
  args:
    - --cwd
    - "{cwd}"
    - -p
    - "{prompt}"
    - --auto-approve
    - --model
    - "{model}"
    - --max-time
    - "{timeout}"
  max_turns: 40
  timeout_seconds: 1800
  always_approve: true


merge:
  enabled: true
  require_checks: false
  require_llm_review: true  # Grok structured review before auto-merge
  require_test_evidence: true

worktrees:
  root: ~/.lokay/worktrees

state:
  path: ~/.lokay/state.jsonl

limits:
  max_issues_per_tick: 1
  max_triage_per_tick: 5
  max_repairs_per_tick: 1
  max_failures_before_block: 2
  min_free_gb: 2
