# Lokay — multi-repo lokay for mikolaj92 source libraries.
# Stubs/fake agents are FORBIDDEN — docs/NO_STUBS.md
#
# Code default is dry-run (no mutations). Set mode: live (or LOKAY_MODE=live)
# only on an intentionally live machine profile.
# Night / live autonomous knobs live in config.live-autonomous.example.yaml
# (do not make that the shared default).

mode: dry-run  # dry-run | live  (dry-run = no mutations; still real agent if invoked)
# Env override: LOKAY_MODE=live|dry-run

# Catalog = which repos we manage (not a denylist).
repos_file: repos.mikolaj92.yaml

github:
  assignee: mikolaj92
  allow_unassigned: false
  ready_label: ai:ready
  blocked_label: ai:blocked
  needs_feedback_label: ai:needs-feedback
  branch_prefix: ai/fix
  pr_labels:
    - ai:generated
    - ai:pr-opened

# Optional overrides / extras (merged by name on top of repos_file):
# repos:
#   - name: mikolaj92/some-extra
#     clone_path: /path/to/clone
#     priority: 50
#     enabled: true
#     review_style: en+kofte  # optional Kofte register for published PR-review prose

# Parent departments (one Fala graph = one department). Each switch is
# independent: LOKAY_DEPARTMENT_EXECUTOR=0 must not disable either sieve.
# Env: LOKAY_DEPARTMENT_SELF_REPAIR / ISSUE_TRIAGE / EXECUTOR / PR_TRIAGE / PR_REPAIR
departments:
  self_repair: true
  issue_triage: true
  executor: true
  pr_triage: true
  pr_repair: true

executor:
  enabled: false  # set true (or LOKAY_EXECUTOR_ENABLED=1) for live lokaying
  agent: pi                  # log label only
  command: pi               # harness binary — swap to change implementation
  model: omniroute/pi
  # args after binary — placeholders: {cwd} {prompt} {model} {max_turns} {timeout} {session}
  # --session-id creates the corner session if missing and resumes it after timeout.
  # --session dies on the first ticket ("No session found matching 'lokay-…'").
  args:
    - -p
    - "{prompt}"
    - --model
    - "{model}"
    - --approve
    - --session-id
    - "{session}"
  max_turns: 40
  timeout_seconds: 1800

limits:
  # After this many request_changes reviews on one PR, label ai:needs-review
  # and stop auto repair/re-review thrash (default 2).
  max_request_changes_per_pr: 2
  max_repairs_per_tick: 1
  max_triage_per_tick: 5
  # K: optional pass budget for issue_to_pr (serial by design; default 1).
  # Ticket after ticket — not concurrent worktrees / Pi / tmux.
  # K>1 is rare breadth across already-isolated clean repos (not recommended).
  # Still one open ai/fix/* PR per repo. Legacy alias: max_issues_per_tick.
  max_issue_to_pr_per_pass: 1

# Trusted auto-merge (humans write issues; lokay closes the loop to main).
#
# Code defaults stay safe for dry-run / local copies:
#   enabled=false, require_checks=false, require_llm_review=true
#
# When the lokay is live, turn merge on via env (preferred) or set enabled: true:
#   LOKAY_MERGE_ENABLED=1          — merge AI PRs that are green + policy-approved
#   LOKAY_REQUIRE_CHECKS=1|0       — 1: pending/none wait (no merge without CI);
#                                    0: allow merge when the branch has no checks
#                                    (code default false; use 1 on real lokays with CI)
#   LOKAY_REQUIRE_LLM_REVIEW=1|0   — 1 (default): structured approve/merge_ok required;
#                                    secrets / needs_human / escalated ai:needs-review
#                                    never auto-merge (fail closed)
#
# Do not set enabled: true in a shared dry-run config — that can merge under --live
# by accident. Prefer LOKAY_MERGE_ENABLED=1 on the live lokay LaunchAgent/profile.
merge:
  enabled: false
  require_checks: false
  require_llm_review: true

# Kofte is optional and only styles public PR-review prose after the structured
# verdict has been validated. Configure its LLM with KOFTE_LLM_BASE_URL,
# KOFTE_LLM_MODEL and optional KOFTE_LLM_API_KEY. Without them, publication
# deterministically falls back to the neutral review comment.
