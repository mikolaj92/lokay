[project]
name = "lokay-review-open-code-review"
version = "0.1.0"
description = "Isolated Alibaba OpenCodeReview adapter for Lokay"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lokay-review-opencode-plugin = "lokay_review_open_code_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokay_review_open_code_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
