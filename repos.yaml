# Commands below are taken from checkout configuration or documented gates.
# This is not execution evidence: Check runs them for the exact candidate SHA.
repos:
- name: mikolaj92/lokay-sandbox
  # Checkout unavailable at the canonical path: Check must stay red until restored.
  clone_path: ~/Developer/lokay-sandbox/main
  test: ["uvx", "pytest", "-q"]
  merge: 'on'
- name: mikolaj92/lokay
  clone_path: ~/Developer/lokay/target
  test: ["bash", "scripts/check.sh"]
  merge: 'on'
- name: mikolaj92/Temida
  clone_path: ~/Developer/Temida/main
  test_timeout: 3600
  setup: ["sh", "-c", "for p in packages/*/; do [ -f \"${p}pyproject.toml\" ] || continue; (cd \"$p\" && uv sync --locked) || exit; done; uv sync --locked"]
  test: ["sh", "-c", "for p in packages/*/; do [ -f \"${p}pyproject.toml\" ] || continue; (cd \"$p\" && echo \"LOKAY_TEST_CWD=$PWD\" && uv run --locked pytest) || exit; done; echo \"LOKAY_TEST_CWD=$PWD\"; uv run --locked pytest tests"]
  merge: 'on'
- name: mikolaj92/msds-portal
  clone_path: ~/.lokay/clones/msds-portal/main
  # Makefile: worker, portal, root and VLM suites.
  test: ["make", "test"]
  merge: 'on'
- name: mikolaj92/Fala
  clone_path: ~/Developer/Fala/main
  # pixi.toml / README: native core and adapters, including Python bindings.
  test: ["pixi", "run", "full-smoke"]
  merge: 'on'
- name: mikolaj92/reviewkit
  clone_path: ~/Developer/reviewkit/main
  test: ["uv", "run", "--locked", "pytest", "-q"]
  merge: 'on'
- name: mikolaj92/heimdall
  clone_path: ~/Developer/heimdall/main
  test: ["uv", "run", "--locked", "pytest", "-q"]
  merge: 'on'
- name: mikolaj92/Docxtor
  clone_path: ~/.lokay/clones/Docxtor/main
  # pyproject.toml: tool.lokay.test.
  test: ["sh", "-c", "uv run --extra dev ruff check . && uv run --extra dev pytest -q"]
  merge: 'on'
- name: mikolaj92/Posejdon
  clone_path: ~/Developer/Posejdon/main
  # README.
  test: ["uv", "run", "--extra", "dev", "pytest"]
  merge: 'on'
- name: mikolaj92/PlnFlr
  clone_path: ~/Developer/PlnFlr/main
  # README: all three Swift packages; pyproject.toml: Python gate.
  test: ["sh", "-c", "swift test --package-path Kernel && swift test --package-path Web && swift test --package-path App && uv run pytest -q"]
  merge: 'on'
- name: mikolaj92/anonimizator3000
  clone_path: ~/Developer/Anonimizator3000/main
  # README.
  test: ["uv", "run", "pytest"]
  merge: 'on'
- name: mikolaj92/emitype
  clone_path: ~/Developer/emitype/main
  # pyproject.toml: tool.lokay.test.
  test: ["uv", "run", "--extra", "dev", "pytest", "-q"]
  merge: 'on'
- name: mikolaj92/wolnyrolnik
  clone_path: ~/Developer/wolnyrolnik/main
  # Makefile.
  test: ["make", "test"]
  merge: 'on'
- name: mikolaj92/rnkstr
  clone_path: ~/Developer/rnkstr/main
  # pyproject.toml: tool.lokay.test (includes backend and e2e).
  test: ["uv", "run", "pytest", "-q"]
  merge: 'on'
- name: mikolaj92/app-factory
  clone_path: ~/Developer/app-factory/main
  # Root tests plus every examples/*/ package with its own pyproject.toml.
  test: ["sh", "-c", "echo \"LOKAY_TEST_CWD=$PWD\" && uv run pytest && for p in examples/*/; do [ -f \"${p}pyproject.toml\" ] || continue; (cd \"$p\" && echo \"LOKAY_TEST_CWD=$PWD\" && uv run pytest) || exit; done"]
  merge: 'on'
- name: mikolaj92/basecoat-factory
