# Lokay — night / live autonomous mill profile (NOT the default).
#
# Copy to config.yaml (or a dedicated path) only on an intentionally live host.
# Humans author intentional issues; the mill consumes them to merged results.
# Do not use this as the shared dry-run example — keep config.example.yaml
# (mode: dry-run, executor off, merge off) for local copies.
#
# Product law:
#   - Trust the issue author (github.assignee / mikolaj92): prefer READY+implement.
#     Do not add distrustful human gates for operator-authored work.
#   - Maximize autonomy. CLOSE / SPLIT / READY+implement are the default exits.
#     NEEDS_HUMAN is a rare residual mailbox, not a brake.
#   - last-pass.json glance ratios are light observability — not a metrics product.
#
# See docs/AUTONOMY.md and docs/WORKING.md.

mode: live  # Env override still honored: LOKAY_MODE=live|dry-run

# Catalog = which repos we manage (not a denylist).
repos_file: repos.mikolaj92.yaml

github:
  # Trusted operator: issues owned/assigned here are intentional — mill consumes.
  assignee: mikolaj92
  allow_unassigned: false
  ready_label: ai:ready
  blocked_label: ai:blocked
  needs_feedback_label: ai:needs-feedback
  branch_prefix: ai/fix
  pr_labels:
    - ai:generated
    - ai:pr-opened

executor:
  enabled: true  # real agent only — docs/NO_STUBS.md
  agent: pi                  # log label only
  command: pi               # harness binary — swap to change implementation
  model: omniroute/pi
  # args after binary — placeholders: {cwd} {prompt} {model} {max_turns} {timeout} {session}
  # --session-id creates the corner session if missing and resumes it after timeout.
  # --session dies on the first ticket ("No session found matching 'lokay-…'").
  args:
    - -p
    - "{prompt}"
    - --model
    - "{model}"
    - --approve
    - --session-id
    - "{session}"
  max_turns: 40
  timeout_seconds: 1800

limits:
  max_request_changes_per_pr: 2
  max_repairs_per_tick: 1
  max_triage_per_tick: 5
  # K: optional pass budget (serial by design; default 1).
  # Ticket after ticket — not concurrent worktrees / Pi / tmux.
  # Still one open ai/fix/* PR per repo.
  max_issue_to_pr_per_pass: 1

# Trusted auto-merge: green checks + structured LLM approve/merge_ok.
# Pending checks → waiting (not stall). Red → repair. Secrets / needs_human /
# escalated ai:needs-review → fail closed (never auto-merge).
merge:
  enabled: true
  require_checks: true
  require_llm_review: true
