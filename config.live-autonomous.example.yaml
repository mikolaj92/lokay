# Lokay — night / live autonomous lokay profile (NOT the default).
#
# Copy to config.yaml (or a dedicated path) only on an intentionally live host.
# Humans author intentional issues; the lokay consumes them to merged results.
# Do not use this as the shared dry-run example — keep config.example.yaml
# (mode: dry-run, executor off, merge off) for local copies.
#
# Product law:
#   - Trust the issue author (github.assignee / mikolaj92): prefer READY+implement.
#     Do not add distrustful human gates for operator-authored work.
#   - Maximize autonomy. CLOSE / SPLIT / READY+implement are the default exits.
#     NEEDS_HUMAN is a rare residual mailbox, not a brake.
#   - last-pass.json glance ratios are light observability — not a metrics product.
#
# See docs/AUTONOMY.md and docs/WORKING.md.

mode: live  # Env override still honored: LOKAY_MODE=live|dry-run

# Catalog = which repos we manage (not a denylist). Empty LOKAY_REPO_SCOPE
# delivers this whole file (~30 enabled rows). That is the production default.
# Set LOKAY_REPO_SCOPE=owner/name only to clamp a canary. Do not default the
# LaunchAgent env to oil-only mikolaj92/lokay.
repos_file: repos.mikolaj92.yaml

github:
  # Trusted operator: issues owned/assigned here are intentional — lokay consumes.
  assignee: mikolaj92
  allow_unassigned: false
  ready_label: ai:ready
  blocked_label: ai:blocked
  needs_feedback_label: ai:needs-feedback
  branch_prefix: ai/fix
  pr_labels:
    - ai:generated
    - ai:pr-opened

executor:
  enabled: true  # real agent only — docs/NO_STUBS.md
  agent: pi                  # log label only
  command: pi               # harness binary — swap to change implementation
  # One task, final response on stdout; harness settings stay with the harness.
  args: [-p, --session-id, "{session}", "{prompt}"]
  max_turns: 40
  timeout_seconds: 1800

# Closed semantic choices only; discovery/planning/coding/review remain agents.
# See docs/DECISIONS.md. Endpoint model identity must match the response exactly.
decisions:
  endpoints:
    plumb:
      url: http://127.0.0.1:8090/v1/systemone
      protocol: systemone
      model: /Users/mini-m4-0/.local/share/plumb/mlx-4bit
      min_confidence: 0.85
      timeout_seconds: 10
      max_input_chars: 24000
    gb10:
      url: http://192.168.1.60:8888/v1/decisions
      protocol: decisions
      model: GLM-5.3-Flash-EXL3
      min_confidence: 0.85
      timeout_seconds: 90
      max_input_chars: 120000
  routes:
    intake_ambiguity: plumb
    issue_triage: gb10
    queue_conflict: plumb
    # relocalization intentionally stays with the agent: GLM scope panel 3/6,
    # all three necessary changes rejected at the configured threshold.

limits:
  max_request_changes_per_pr: 2
  max_repairs_per_tick: 1
  max_triage_per_tick: 5
  # K: optional pass budget (serial by design; default 1).
  # Ticket after ticket — not concurrent worktrees / Pi / tmux.
  # Still one open ai/fix/* PR per repo.
  max_issue_to_pr_per_pass: 1

# Trusted auto-merge: local repository tests + structured LLM approval.
# GitHub Actions and remote CI are not used. Secrets / needs_human /
# escalated ai:needs-review still fail closed.
merge:
  enabled: true
  require_checks: false
  require_llm_review: true
